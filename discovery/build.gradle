plugins {
    id 'com.android.library'
    id 'org.jetbrains.kotlin.android'
    id 'maven-publish'
}

android {
    namespace = 'cn.lancet.discovery'
    compileSdk 36

    defaultConfig {
        minSdk 23
        targetSdk 33

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
    kotlinOptions {
        jvmTarget = '1.8'
    }

    buildFeatures {
        viewBinding true
//        dataBinding true
    }

}

dependencies {

    implementation 'androidx.core:core-ktx:1.17.0'
    implementation 'androidx.appcompat:appcompat:1.7.1'
    implementation 'com.google.android.material:material:1.13.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.2.1'
    implementation 'androidx.lifecycle:lifecycle-livedata-ktx:2.10.0'
    implementation 'androidx.lifecycle:lifecycle-viewmodel-ktx:2.10.0'
    implementation project(path: ':common')
    testImplementation 'junit:junit:4.13.2'
    androidTestImplementation 'androidx.test.ext:junit:1.3.0'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.7.0'

//    implementation 'com.google.android.gms:play-services-code-scanner:16.0.0'

}

task sourceJar(type:Jar) {
    from android.sourceSets.main.java.getSrcDirs()
    archiveClassifier = "sources"
}
def localDefaultRepo = "file://"+new File(System.getProperty("user.home"),'.m2/repository').absolutePath
publishing {
    repositories {  RepositoryHandler  handler->
        handler.mavenLocal()
        handler.maven {
            url "${localDefaultRepo}/repo"
        }

        handler.maven { MavenArtifactRepository mavenArtifactRepository->

            url "htp://10.0.192.56:8081/repository/core/"

            credentials {
                username = "Admin"
                password = "135246"
            }

        }

    }

    publications { PublicationContainer publicationContainer->

        debug(MavenPublication){

            artifact sourceJar // 上传源码

            afterEvaluate { artifact(tasks.getByName("bundleReleaseAar"))}
            groupId = "cn.lancet.discovery"
            artifactId = "discovery"
            version = "0.9.2-SNAPSHOT"
        }

        release(MavenPublication) {
            afterEvaluate { artifact(tasks.getByName("bundleReleaseAar"))}
            groupId = "cn.lancet.discovery"
            artifactId = "discovery"
            version = "0.9.2"
        }

    }


}















